# Balanceador da Pessoa 03: um único endereço (http://localhost:4000) na frente
# de todas as réplicas do chat. Cada conexão WebSocket fica presa ao nó que a
# recebeu; se esse nó cair, o cliente reconecta e o Nginx escolhe outro nó vivo.

worker_processes auto;
events { worker_connections 10240; }

http {
  # DNS interno do Docker. Nó parado some do DNS; réplica nova aparece.
  resolver 127.0.0.11 valid=2s ipv6=off;

  # Registra para qual nó cada requisição foi enviada (útil na apresentação).
  log_format balanceador '$time_local $remote_addr "$request" $status '
                         'no=$upstream_addr tempo=$upstream_connect_time';
  access_log /dev/stdout balanceador;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream chat_cluster {
    zone chat_cluster 64k;
    # Conexões WebSocket são longas: escolher o nó com menos conexões abertas
    # distribui melhor do que alternar requisição por requisição.
    least_conn;
    # `resolve` reconsulta o DNS sem reiniciar o Nginx (nginx >= 1.27.3).
    # Uma falha tira o nó de rotação por 5 s (verificação passiva de saúde).
    server chat:4000 resolve max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://chat_cluster;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # $http_host mantém a porta (localhost:4000). O Phoenix usa check_origin: :conn
      # e recusa o WebSocket (403) se Host e Origin do navegador não baterem.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Nó que não atende rápido é pulado e a requisição vai para o próximo.
      # Na rede interna um nó vivo aceita em milissegundos; 1 s já indica nó morto.
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;

      # O cliente Phoenix manda heartbeat a cada 30 s; 2 min evita cortes falsos.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      add_header X-Chat-Upstream $upstream_addr always;
    }

    location = /lb-status {
      stub_status;
    }
  }
}
